# 站点执行规则（随 companion-service.jar 发布）。
#
# 这里只放「通用加载链覆盖不到」的例外，每条都要写清原因；能靠通用逻辑解决的不要往这里加。
# 用户目录 ~/.xiugou_tv_companion/source-rules.properties 可追加或覆盖同名键，无需重新打包；
# 例外：blocked 只会与内置列表合并（崩溃保护不允许被用户文件意外解除）。
#
# 键格式（api 一律按去掉 csp_/csp 前缀后的名字匹配）：
#   alias.<小写 api>=<内置 spider 类名>   内置实现别名（只在载荷里找不到真实爬虫时才会用到）
#   default.ext.<api>=<ext>               配置缺 ext 时的默认值（配置给了 ext 时不干预）
#   blocked=<小写 api>,<小写 api>         加载前直接拒绝的载荷

# ---- alias：Bilibili 系 ----
alias.bili=Bili
alias.biliguard=Bili
alias.biliych=Bili
alias.bilibili=Bili

# ---- alias：看球 / 直播 ----
alias.kanqiu=Kanqiu
alias.kanqiuguard=Kanqiu
alias.livekanqiu=Kanqiu

# ---- alias：推送 ----
alias.push=Push
alias.pushguard=Push
alias.push_agent=Push

# ---- alias：AList 网盘 ----
alias.alist=AList
alias.alistguard=AList

# DouDouGuard 是安卓原生加固包装，不是豆瓣。显式标成不支持，
# 避免桌面端伪造分类、却静默返回空列表。
alias.doudouguard=UnsupportedGuardSpider
alias.doudou=UnsupportedGuardSpider

# ---- alias：糯米 ----
alias.nmys=Nmys
alias.nmysguard=Nmys
alias.nmyswv=Nmys
alias.nmyswvguard=Nmys
alias.nuomi=Nmys

# ---- alias：AppYsV2 / CMS Web App 系 ----
alias.appysv2=AppYsV2
alias.appttguard=AppYsV2
alias.app99guard=AppYsV2
alias.appsxguard=AppYsV2
alias.appgzguard=AppYsV2
alias.hmysguard=AppYsV2
alias.newczguard=AppYsV2
alias.bttwooguard=AppYsV2
alias.jpysguard=AppYsV2
alias.ycyzguard=AppYsV2

# ---- default.ext ----
# 饭太硬配置的 csp_NewCzGuard 缺 ext，载荷把 ext 当 baseUrl 的唯一来源，
# 空 ext 时 homeContent 只返回 {"code":0,"data":""}；官方 csp_NewCz 用的就是这个地址，
# 补上后同一份载荷返回 11 分类 / 57 部。
default.ext.NewCzGuard=https://www.czzy77.com/

# ---- blocked ----
# csp_FyGuard → 载荷类 Fy（继承 Pan）→ Pan.init 在 Windows JDK21 上稳定触发
# EXCEPTION_ACCESS_VIOLATION（-Xint 同样崩，排除 JIT）。Java 层捕获不到 SIGSEGV，
# 放进来一个，整个 companion 连同其它站一起死，只能不加载。
blocked=fyguard,fy
